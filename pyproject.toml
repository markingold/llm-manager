[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "0.2.0"
description = "Local control plane and policy router for multi-slot LLM serving"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "markingold" }]
dependencies = [
  "fastapi>=0.112,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
training = [
  "accelerate>=0.34,<2",
  "bitsandbytes>=0.43,<1",
  "datasets>=2.21,<5",
  "huggingface-hub>=0.24,<2",
  "peft>=0.12,<1",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "transformers>=4.44,<6",
]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
llm-manager-api = "llm_manager.server:main"
llm-manager-deploy = "llm_manager.deployment:main"

[tool.setuptools]
packages = ["llm_manager", "llm_manager.evaluation", "llm_manager.providers", "llm_manager.router"]

[tool.setuptools.data-files]
"share/llm-manager/config" = [
  "config/provider_models.json",
  "config/provider_policies.json",
  "config/settings.example.env",
  "config/engine-chat.env",
  "config/engine-intent.env",
  "config/engine-small.env",
  "config/engine-embed.env",
  "config/backend-pins.json",
]
"share/llm-manager/web" = ["web/index.html", "web/app.js", "web/lab.meta.json", "web/package.json"]
"share/llm-manager/web/js" = ["web/js/api.js", "web/js/ui-core.js"]
"share/llm-manager/web/js/domains" = [
  "web/js/domains/evaluation.js",
  "web/js/domains/governance.js",
  "web/js/domains/operations.js",
  "web/js/domains/providers-budget.js",
  "web/js/domains/router.js",
  "web/js/domains/shell.js",
]
"share/llm-manager/systemd" = ["deploy/systemd/llm-manager-api.service", "deploy/systemd/llm-manager-engine@.service"]
"share/llm-manager/sudoers" = ["deploy/sudoers/llm-manager"]
"share/llm-manager/run" = ["run/engine_launcher.py", "run/launch_tgw.py", "run/launch_vllm.py", "run/launch_tabbyapi.py", "run/launch_llamacpp.py"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra --cov=llm_manager --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_manager"]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["diff.txt", "run/state", "docs/reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
