[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "0.1.0"
description = "Local control plane and policy router for multi-slot LLM serving"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "markingold" }]
dependencies = [
  "fastapi>=0.112,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
training = [
  "accelerate>=0.34,<2",
  "bitsandbytes>=0.43,<1",
  "datasets>=2.21,<5",
  "huggingface-hub>=0.24,<2",
  "peft>=0.12,<1",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "transformers>=4.44,<6",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
llm-manager-api = "api.server:main"

[tool.setuptools]
packages = ["api", "api.evaluation", "api.providers", "api.router"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra --cov=api --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
fail_under = 20
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["diff.txt", "run/state", "docs/reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
