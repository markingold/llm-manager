name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Unit tests and coverage gate
        run: python -m pytest
      - name: JavaScript regression tests
        run: node --test tests/js/*.test.mjs
      - name: Static checks
        run: |
          ruff check llm_manager tests scripts run/engine_launcher.py run/launch_tgw.py run/launch_vllm.py run/launch_tabbyapi.py
          python -m compileall -q llm_manager run
          python scripts/check_secrets.py
      - name: Build distribution
        run: |
          python -m build
          python -m pip install --no-deps --target /tmp/llm-manager-wheel dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/llm-manager-wheel python -m llm_manager.deployment doctor --asset-root /tmp/llm-manager-wheel/share/llm-manager
          install_root=$(mktemp -d /tmp/llm-manager-install.XXXXXX)
          PYTHONPATH=/tmp/llm-manager-wheel python -m llm_manager.deployment bootstrap \
            --asset-root /tmp/llm-manager-wheel/share/llm-manager \
            --home "$install_root/home" \
            --config-dir "$install_root/etc" \
            --web-dir "$install_root/web" \
            --systemd-dir "$install_root/systemd" \
            --sudoers-dir "$install_root/sudoers" \
            --run-dir "$install_root/run"
          test -f "$install_root/systemd/llm-manager-engine@.service"
          test -x "$install_root/run/engine_launcher.py"
          PYTHONPATH=/tmp/llm-manager-wheel python -c 'from llm_manager.server import app; assert app.title == "LLM Manager API"'
