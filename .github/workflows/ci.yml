name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked development dependencies
        run: |
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Unit tests and coverage gate
        run: python -m pytest
      - name: JavaScript regression tests
        run: node --test tests/js/*.test.mjs
      - name: Static checks
        run: |
          ruff check api tests scripts run/engine_launcher.py run/launch_tgw.py run/launch_vllm.py run/launch_tabbyapi.py
          python -m compileall -q api run
          python scripts/check_secrets.py
      - name: Build distribution
        run: python -m build
